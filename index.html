<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d18"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="format-detection" content="telephone=no"><meta name="mobile-web-app-capable" content="yes"><title>投资实验室</title><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css"></head><body><div id="app"><header class="topbar"><div><div class="brand">投资实验室</div><div class="sub">真实行情 · 模拟交易 · 策略回测</div></div><button id="refreshBtn" class="icon-btn">↻</button></header><main><section id="dashboard" class="page active"><div class="hero-card"><div class="muted">模拟账户总资产</div><div id="totalAssets" class="big-number">¥0.00</div><div class="asset-row"><span>现金 <b id="cash">¥0.00</b></span><span>持仓市值 <b id="marketValue">¥0.00</b></span></div></div><div class="grid-2"><button class="action-card" data-go="market">📈<b>行情</b><small>股票 · ETF · 基金</small></button><button class="action-card" data-go="backtest">🧪<b>回测</b><small>策略与风险指标</small></button><button class="action-card" data-go="portfolio">💼<b>组合</b><small>虚拟资金交易</small></button><button class="action-card" data-go="data">🗂️<b>数据</b><small>CSV 导入与导出</small></button></div><section class="panel"><div class="panel-title"><b>组合概览</b><button class="text-btn" data-go="portfolio">全部</button></div><div id="dashboardPositions" class="empty">还没有模拟持仓</div></section></section><section id="market" class="page"><div class="section-head"><h2>行情</h2><p>支持美股、A股代码，以及 Yahoo 可识别的 ETF/基金</p></div><form id="quoteForm" class="search"><select id="marketType" aria-label="资产类型"><option value="auto">自动识别</option><option value="stock">股票</option><option value="etf">ETF</option><option value="fund">基金</option></select><input id="symbolInput" placeholder="AAPL / 600519 / 000001.SZ / 000001"><button>查询</button></form><div id="quoteResult"></div><div id="klinePanel" class="panel kline-panel"><div class="panel-title"><b>K线</b><div id="klineRange" class="chips"><button type="button" class="chip active" data-range="3m">3个月</button><button type="button" class="chip" data-range="1y">1年</button><button type="button" class="chip" data-range="5y">5年</button><button type="button" class="chip" data-range="max">40年</button></div></div><div id="klineInfo" class="muted">查询标的后加载日K</div><div id="klineChart"></div></div><div class="panel"><div class="panel-title"><b>最近查询</b></div><div id="recentSymbols" class="chips"></div></div></section><section id="backtest" class="page"><div class="section-head"><h2>策略回测</h2><p>历史日线逐日模拟</p></div><form id="backtestForm" class="panel form-grid"><label>资产类型<select id="btType"><option value="auto">自动识别</option><option value="stock">股票</option><option value="etf">ETF</option><option value="fund">基金</option></select></label><label>标的<input id="btSymbol" value="AAPL"></label><label>初始资金<input id="btCapital" type="number" value="100000" min="1"></label><label>开始日期<input id="btStart" type="date"></label><label>结束日期<input id="btEnd" type="date"></label><label>策略<select id="btStrategy"><option value="buyhold">买入并持有</option><option value="ma">双均线 20/60</option><option value="dca">定期定额</option><option value="rsi">RSI 30/70</option></select></label><label>默认手续费率<input id="btFee" type="number" value="0.0005" min="0" step="0.0001"></label><label>买入费率<input id="btBuyFee" type="number" value="0.0005" min="0" step="0.0001"></label><label>卖出费率<input id="btSellFee" type="number" value="0.0005" min="0" step="0.0001"></label><label>最低单笔费用<input id="btMinFee" type="number" value="0" min="0" step="0.01"></label><label>卖出附加费率<input id="btStamp" type="number" value="0" min="0" step="0.0001"></label><label>最小交易单位<input id="btLot" type="number" value="1" min="0.000001" step="1"></label><label>滑点<input id="btSlippage" type="number" value="0.0005" min="0" step="0.0001"></label><label>仓位比例<input id="btPosition" type="number" value="1" min=".01" max="1" step=".05"></label><label>无风险年利率<input id="btRiskFree" type="number" value="0" min="0" max="100" step=".1"></label><button class="primary full">开始回测</button></form><div id="backtestResult"></div></section><section id="portfolio" class="page"><div class="section-head"><h2>模拟组合</h2><p>只使用虚拟资金</p></div><div class="panel"><div class="asset-row"><span>现金 <b id="portfolioCash">¥0.00</b></span><span>总资产 <b id="portfolioTotal">¥0.00</b></span></div></div><div id="positions" class="stack"></div><form id="tradeForm" class="panel form-grid"><label>资产类型<select id="tradeType"><option value="auto">自动识别</option><option value="stock">股票</option><option value="etf">ETF</option><option value="fund">基金</option></select></label><label>代码<input id="tradeSymbol" placeholder="AAPL"></label><label>方向<select id="tradeSide"><option value="buy">买入</option><option value="sell">卖出</option></select></label><label>数量<input id="tradeQty" type="number" min=".0001" step=".0001" value="1"></label><label>成交价<input id="tradePrice" type="number" min="0" step=".0001" placeholder="自动获取"></label><label>手续费率<input id="tradeFee" type="number" value=".0005" min="0" step=".0001"></label><button class="primary full">执行模拟交易</button></form><div class="panel"><div class="panel-title"><b>交易记录</b></div><div id="trades" class="stack"></div></div></section><section id="data" class="page"><div class="section-head"><h2>数据中心</h2><p>导入自有历史数据或备份账户</p></div><div class="panel"><h3>CSV 导入</h3><p class="muted">格式：date,open,high,low,close,volume；date、close 必填。</p><label>数据类型<select id="csvType"><option value="auto">自动</option><option value="stock">股票</option><option value="etf">ETF</option><option value="fund">基金</option></select></label><input id="csvFile" type="file" accept=".csv,text/csv"><div id="csvInfo" class="import-info">尚未导入数据</div><button id="clearCsvBtn" class="secondary">清除本地数据</button></div><div class="panel"><h3>数据与账户</h3><div class="button-row"><button id="exportBtn" class="secondary">导出账户 JSON</button><label class="file-button">导入账户 JSON<input id="importAccount" type="file" accept=".json,application/json"></label><button id="resetBtn" class="danger">重置模拟账户</button></div></div></section><section id="settings" class="page"><div class="section-head"><h2>设置</h2><p>接口代理与账户参数</p></div><form id="settingsForm" class="panel form-grid"><label>API 代理地址<input id="apiBase" placeholder="可选：Cloudflare Worker 地址"></label><label>美元兑人民币<input id="usdCny" type="number" value="7.2" min="0.1" step="0.01"></label><label>初始模拟资金<input id="initialCash" type="number" min="0" step=".01"></label><button class="primary full">保存设置</button></form></section></main><nav class="tabbar"><button class="tab active" data-go="dashboard">⌂<span>首页</span></button><button class="tab" data-go="market">⌁<span>行情</span></button><button class="tab" data-go="backtest">◫<span>回测</span></button><button class="tab" data-go="portfolio">◉<span>组合</span></button><button class="tab" data-go="data">▣<span>数据</span></button><button class="tab" data-go="settings">⚙<span>设置</span></button></nav></div><div id="toast" class="toast"></div><script type="module" src="./app.js?v=20260928-9"></script></body></html>
