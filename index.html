<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>投资模拟器</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="brand">投资模拟器</div>
        <div class="sub">股票 · 基金 · 回测</div>
      </div>
      <button id="refreshBtn" class="icon-btn" aria-label="刷新">↻</button>
    </header>

    <main>
      <section id="dashboard" class="page active">
        <div class="hero-card">
          <div class="muted">模拟账户总资产</div>
          <div id="totalAssets" class="big-number">¥0.00</div>
          <div class="asset-row">
            <span>现金 <b id="cash">¥0.00</b></span>
            <span>持仓市值 <b id="marketValue">¥0.00</b></span>
          </div>
        </div>

        <div class="grid-2">
          <button class="action-card" data-go="market"><span>📈</span><b>行情</b><small>查询真实市场数据</small></button>
          <button class="action-card" data-go="backtest"><span>🧪</span><b>回测</b><small>验证投资策略</small></button>
          <button class="action-card" data-go="portfolio"><span>💼</span><b>组合</b><small>管理模拟持仓</small></button>
          <button class="action-card" data-go="settings"><span>⚙️</span><b>设置</b><small>数据源与账户</small></button>
        </div>

        <section class="panel">
          <div class="panel-title"><b>持仓</b><button class="text-btn" data-go="portfolio">全部</button></div>
          <div id="dashboardPositions" class="empty">还没有模拟持仓</div>
        </section>
      </section>

      <section id="market" class="page">
        <div class="section-head"><div><h2>行情</h2><p>输入股票、ETF 或基金代码</p></div></div>
        <form id="quoteForm" class="search">
          <input id="symbolInput" autocomplete="off" placeholder="例如 AAPL、MSFT、600519.SS">
          <button>查询</button>
        </form>
        <div id="quoteResult"></div>
        <div class="panel">
          <div class="panel-title"><b>最近查询</b></div>
          <div id="recentSymbols" class="chips"></div>
        </div>
      </section>

      <section id="backtest" class="page">
        <div class="section-head"><div><h2>策略回测</h2><p>使用真实历史行情进行模拟</p></div></div>
        <form id="backtestForm" class="panel form-grid">
          <label>标的<input id="btSymbol" value="AAPL" placeholder="AAPL"></label>
          <label>初始资金<input id="btCapital" type="number" value="100000" min="1"></label>
          <label>开始日期<input id="btStart" type="date"></label>
          <label>结束日期<input id="btEnd" type="date"></label>
          <label>策略
            <select id="btStrategy">
              <option value="buyhold">买入并持有</option>
              <option value="ma">双均线（20/60）</option>
              <option value="dca">定期定额（每月）</option>
            </select>
          </label>
          <button class="primary full" type="submit">开始回测</button>
        </form>
        <div id="backtestResult"></div>
      </section>

      <section id="portfolio" class="page">
        <div class="section-head"><div><h2>模拟组合</h2><p>用虚拟资金进行真实行情下的交易</p></div></div>
        <div class="panel">
          <div class="asset-row"><span>现金 <b id="portfolioCash">¥0.00</b></span><span>总资产 <b id="portfolioTotal">¥0.00</b></span></div>
        </div>
        <div id="positions" class="stack"></div>
        <form id="tradeForm" class="panel form-grid">
          <label>代码<input id="tradeSymbol" placeholder="AAPL"></label>
          <label>方向<select id="tradeSide"><option value="buy">买入</option><option value="sell">卖出</option></select></label>
          <label>数量<input id="tradeQty" type="number" min="0.0001" step="0.0001" value="1"></label>
          <label>成交价<input id="tradePrice" type="number" min="0" step="0.0001" placeholder="自动获取"></label>
          <button class="primary full" type="submit">执行模拟交易</button>
        </form>
        <div class="panel"><div class="panel-title"><b>交易记录</b></div><div id="trades" class="stack"></div></div>
      </section>

      <section id="settings" class="page">
        <div class="section-head"><div><h2>设置</h2><p>数据源和模拟账户参数</p></div></div>
        <form id="settingsForm" class="panel form-grid">
          <label>行情接口
            <select id="provider">
              <option value="yahoo">Yahoo Finance Chart API</option>
              <option value="stooq">Stooq（历史数据备用）</option>
            </select>
          </label>
          <label>API 代理地址<input id="apiBase" placeholder="可选，例如 https://你的-worker.workers.dev"></label>
          <label>初始模拟资金<input id="initialCash" type="number" min="0" step="0.01"></label>
          <button class="primary full">保存设置</button>
        </form>
        <div class="panel notice">
          <b>数据说明</b>
          <p>本软件只用于模拟与研究。行情数据来自外部数据服务，可能存在延迟、缺失、复权方式差异或接口限制。</p>
        </div>
      </section>
    </main>

    <nav class="tabbar">
      <button class="tab active" data-go="dashboard">⌂<span>首页</span></button>
      <button class="tab" data-go="market">⌁<span>行情</span></button>
      <button class="tab" data-go="backtest">◫<span>回测</span></button>
      <button class="tab" data-go="portfolio">◉<span>组合</span></button>
      <button class="tab" data-go="settings">⚙<span>设置</span></button>
    </nav>
  </div>
  <div id="toast" class="toast"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
